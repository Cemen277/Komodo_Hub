<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Summary</title>
    <link rel="stylesheet" href="library1.css">
    <link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Library Summary Container -->
    <div class="library-summary-container">
        <div class="library-summary-header">
            <div class="back-button-container">
                <img src="Visuals/back.png" alt="Back Button" class="back-button">
            </div>
            <div class="library-summary-text">
                <span class="library-summary-title">Green Community</span>
                <span class="library-summary-members">158 members</span>
            </div>
        </div>
        <div class="library-summary-content">
            Green Community is dedicated to protecting Indonesia’s endangered wildlife and natural habitats. 
            Join us in raising awareness, supporting conservation efforts, and preserving biodiversity for future generations.
        </div>
    </div>

    <!-- Article Container -->
    <button class="article">
        <div class="article-title-container">
            <span class="article-title">Article 1</span>
            <img src="Visuals/next.png" alt="more_info_button" class="next_button">
        </div>
        <div class="article-image-container">
            <img src="Visuals/example.png" alt="article Image">
        </div>
    </button>

    <nav class="control_bar">
        <div class="buttons_background">
            <div class="clickable buttons", onclick="window.location.href='home_page.html';">
                <img src="Visuals/home - pressed.png" alt="home button" class="control_button">
            </div>
            <div class="clickable buttons", onclick="window.location.href='library.html';" >
                <img src="Visuals/library - unpressed.png" alt="library button" class="control_button">
            </div>
            <div class="buttons">
                <img src="Visuals/create button - unpressed.png" alt="create button" class="control_button">
            </div>
            <div class="buttons">
                <img src="Visuals/hub - unpressed.png" alt="community button" class="control_button">
            </div>
            <div class="buttons">
                <img src="Visuals/account - unpressed.png" alt="account button" class="control_button">
            </div>
        </div>
    </nav>

</body>
</html>
