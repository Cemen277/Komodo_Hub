<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link rel="stylesheet" href="chat_content.css">
    <link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../Visuals/Logo.png">
</head>
<body>
    <div class="control_bar">
        <div class="message_container">
            <input type="text" class="message_input" id="message_input"placeholder="Message">
            <div class="send" id="send_button" style="display: none;">
                <img src="../Visuals/send.png" alt="Go Back">
            </div>
            <div class="media" id="media_button" style="display: none;">
                <img src="../Visuals/media.png" alt="Go Back">
                <input type="file" id="media_upload" >
            </div>
        </div>
    </div>

    <div class="block_wraper" id="scroll_block">
        <div class="top" id="top">
            
        </div>
        
    </div>

    <script>
        document.addEventListener("touchstart", function() {}, true); // Trick Safari into recognizing :active
    </script>
    <script src="chat_content.js"></script>
</body>
</html>
