<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home_page.css">
    <link href="https://fonts.googleapis.com/css2?family=Kameron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="Visuals/Logo.png">
</head>
<body>
    <div class="control_bar">
        <div class="buttons_background">
            <div class="buttons" id="home_page">
                <img src="Visuals/home - pressed.png" alt="home button" class="control_button">
            </div>
            <div class="buttons" id="library_page">
                <img src="Visuals/library - unpressed.png" alt="library button" class="control_button">
            </div>
            <div class="buttons" id="create_page">
                <img src="Visuals/create button - unpressed.png" alt="create button" class="control_button">
            </div>
            <div class="buttons" id="community_page">
                <img src="Visuals/hub - unpressed.png" alt="community button" class="control_button">
            </div>
            <div class="buttons" id="account_page">
                <img src="Visuals/account - unpressed.png" alt="account button" class="control_button">
            </div>
        </div>
    </div>
    <div class="block"> 
        
        <div class="header"> 
            <span class="community" id="organisation_name">Forest School</span>
            <span class="program" id="programme_name">Eco Guardians Program</span>
        </div>
        <nav class="button-area">
            <a href="Activities Page - front/activities.html">Activities<img src="Visuals/next.png" alt="Arrow"></a>
            <a href="Tasks Page - front/all_tasks.html">Tasks<img src="Visuals/next.png" alt="Arrow"></a>
            <a href="Feedback Page - front/feedback.html">Feedback<img src="Visuals/next.png" alt="Arrow"></a>
            <a href="Chats Page - front/chats.html">Chats<img src="Visuals/next.png" alt="Arrow"></a>
            <a href="Progress Page - front/progress.html" class="last_option">Progress<img src="Visuals/next.png" alt="Arrow"></a>
        </nav>
       
    </div>
    <script>
        document.addEventListener("touchstart", function() {}, true); // Trick Safari into recognizing :active
    </script>

    <script src="home_page.js"></script>
</body>
</html>
