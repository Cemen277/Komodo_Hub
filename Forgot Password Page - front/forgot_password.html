<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forgot Password - Komodo Hub</title>
   <link rel="stylesheet" href="forgot_password.css">
   <link rel="icon" type="image/x-icon" href="Visuals/Logo.png"> <!-- For Browser Tab Icon -->
</head>
<body>
   <div class="logo">
       <img src="Visuals/Logo.png" alt="Komodo Hub Logo">
   </div>
   <h1 class="title">Almost there! Reset now.</h1>
   <div class="forgot_password_container">
       <h2 class="heading_1">Enter your email to reset it and get back to exploring and protecting nature.</h2>
       <div class="line_1"></div>
       <form> <!-- Forgot password form -->
           <input type="email" name="email" id="email" placeholder="email address" required="" maxlength="50">
           <div class="line_2"></div>
           <button class="reset_password_button" type="submit">Reset Password</button>
       </form>
   </div>
</body>
</html>
