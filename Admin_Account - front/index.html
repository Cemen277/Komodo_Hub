<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile">
                <img src="images/cat.webp" alt="Profile" class="profile-img">
                <div class="profile-info">
                    <h2>Forest School</h2>
                    <p>Super Administrator</p>
                </div>
            </div>
            <nav class="menu">
                <a href="#">General Settings <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Team & Permissions <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Library Management <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Moderation <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Privacy & Security <img src="images/next.png" alt="Arrow"></a>
            </nav>
            <button class="signout">Sign Out</button>
        </aside>
        <main class="content">
            <p><strong>Number of users:</strong> 120</p>
            <p><strong>Number of reports:</strong> 1</p>
            <div class="actions">
                <a href="#">Update name <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Update profile image <button class="browse">Browse files</button></a>
                <a href="#">Update description <img src="images/next.png" alt="Arrow"></a>
                <a href="#">Manage programs <img src="images/next.png" alt="Arrow"></a>
            </div>
        </main>
    </div>
</body>
</html>
