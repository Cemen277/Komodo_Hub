<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Change Email- Komodo Hub</title>
   <link rel="stylesheet" href="change_email.css">
   <link rel="icon" type="image/x-icon" href="Visuals/Logo.png"> <!-- For Browser Tab Logo -->
</head>
<body>
    <div class="block_wrapper"> 
        <div class="block">
            <h1>Change Email Address</h1> 
            <div class="input_block">
                <input type="text" class="change_email" id="change_email" placeholder="" required maxlength="50">
                <div class="delete_button" id="delete_button">
                    <img src="Visuals/cancel.png" alt="Delete">
                </div>
            </div>
            <button class="update" id="update">Update</button>
            
        </div>
    </div>
   
   <nav class="navigation_bar">
       <div class="background_container">
           <a class="button" id="home_page">
               <img src="Visuals/home - unpressed.png" alt="Home Button">
           </a>
           <a class="button" id="library_page">
               <img src="Visuals/library - unpressed.png" alt="Library Button">
           </a>
           <a class="button" id="create_page">
               <img src="Visuals/create button - unpressed.png" alt="Create Button">
           </a>
           <a class="button" id="community_page">
               <img src="Visuals/hub - pressed.png" alt="Community Hub Button">
           </a>
           <a class="button" id="account_page">
               <img src="Visuals/account - unpressed.png" alt="Account Button">
           </a>
       </div>
   </nav>
   <script src="change_email.js"></script>
</body>
</html>
