<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="registered.css">
</head>
<body>
    
    <aside class="sidebar">
        <div class="profile">
            <div class="image_container">
                <img src="images/cat.webp" alt="Profile" class="profile-img" id="profile_image">
                <label for="media_input" class="edit_label" id="edit_label">
                    <img src="Visuals/create button - pressed.png" alt="edit image" class="edit_image">
                </label>
            
                <!-- Hidden file input -->
                <input type="file" name="media_input" id="media_input" accept="image/png, image/jpg, image/jpeg">
            </div>
            
            <div class="profile-info">
                <h2 id="full_name"></h2>
                <h3 id="username"></h3>
                <p id="organisation"></p>
            </div>
        </div>
        <nav class="menu">
            <a href="change_name.html">Change name <img src="Visuals/next.png" alt="Arrow"></a>
            <a href="change_username.html">Change username <img src="Visuals/next.png" alt="Arrow"></a>
            <a href="change_email.html">Change email address <img src="Visuals/next.png" alt="Arrow"></a>
            <a href="change_community.html">Change community <img src="Visuals/next.png" alt="Arrow"></a>
            <a href="change_prgramme.html" id="programme_button">Change programme <img src="Visuals/next.png" alt="Arrow"></a>
            <a href="change_password.html" class="last_option">Change password <img src="Visuals/next.png" alt="Arrow"></a>
        </nav>
    </aside>
    <footer class="bottom-navbar">
        <nav class="navigation_bar">
            <div class="background_container">
                <a class="button" id="home_page">
                    <img src="Visuals/home - unpressed.png" alt="Home Button">
                </a>
                <a class="button" id="library_page">
                    <img src="Visuals/library - unpressed.png" alt="Library Button">
                </a>
                <a class="button" id="create_page">
                    <img src="Visuals/create button - unpressed.png" alt="Create Button">
                </a>
                <a class="button" id="community_page">
                    <img src="Visuals/hub - unpressed.png" alt="Community Hub Button">
                </a>
                <a class="button" id="account_page">
                    <img src="Visuals/account - pressed.png" alt="Account Button">
                </a>
            </div>
        </nav>
    </footer>

    
    <script src="registered.js"></script>
</body>
</html>
