<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Non Registered - Komodo Hub</title>
    <link rel="stylesheet" href="create_nonreg.css">
    <link rel="icon" type="image/x-icon" href="Visuals/Logo.png"> <!-- For Browser Tab Logo -->
</head>
<body>
    <div class="create_container">
        <div class="heading_container">
            <img src="Visuals/account - pressed.png" alt="Account Logo" class="account_logo">
            <h1 class="title">Not Registered</h1>
        </div>
        <div class="line line_1"></div>
        <h2 class="heading_1">Want to share? Create an account to post and engage.</h2>
        <button class="sign_up_button" onclick="window.location.href='../SignUp Page - front/sign_up.html'">Sign Up</button>
    </div>

    <nav class="navigation_bar">
        <div class="background_container">
            <a class="button" id="home_page">
                <img src="Visuals/home - unpressed.png" alt="Home Button">
            </a>
            <a class="button" id="library_page">
                <img src="Visuals/library - unpressed.png" alt="Library Button">
            </a>
            <a class="button" id="create_page">
                <img src="Visuals/create button - pressed.png" alt="Create Button">
            </a>
            <a class="button" id="community_page">
                <img src="Visuals/hub - unpressed.png" alt="Community Hub Button">
            </a>
            <a class="button" id="account_page">
                <img src="Visuals/account - unpressed.png" alt="Account Button">
            </a>
        </div>
    </nav>
    <script src="create_nonreg.js"></script>
</body>
</html>
