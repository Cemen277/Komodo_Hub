<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Komodo Hub</title>
    <link rel="stylesheet" href="reset_password.css">
    <link rel="icon" type="image/x-icon" href="Visuals/Logo.png"> <!-- For Browser Tab Icon -->
</head>
<body>
    <div class="logo">
        <img src="Visuals/Logo.png" alt="Komodo Hub Logo">
    </div>
    <h1 class="title">Almost there! Reset now.</h1>
    <div class="forgot_password_container">
        <h2 class="heading_1">Enter your email to reset it and get back to exploring and protecting nature.</h2>
        <div class="line line_1"></div>

        <form class="forgot_password_form" id="forgot_password_form" method="post" action=""> <!-- Forgot password form -->
            <input type="password" name="password" id="password" placeholder="new password" required="" maxlength="30">
            <div class="line line_2"></div>
            <button class="reset_password_button" type="submit">Update</button>
        </form>

    </div>
    <script src="reset_password.js"></script>
</body>
</html>
